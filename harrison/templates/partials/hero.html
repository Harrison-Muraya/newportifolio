{% load static %}
<section id="home" class="relative min-h-screen flex items-center pt-20 overflow-hidden">
    <!-- Background effects -->
    <div class="absolute inset-0 overflow-hidden pointer-events-none">

        <div class="absolute bottom-1/4 right-1/4 w-80 h-80 bg-fuchsia-600/15 rounded-full blur-[100px] animate-pulse" style="animation-delay:2s"></div>
        <div class="absolute top-1/2 left-1/2 w-64 h-64 bg-blue-600/10 rounded-full blur-[80px] animate-pulse" style="animation-delay:4s"></div>

        <div class="absolute inset-0 bg-[linear-gradient(rgba(255,255,255,0.015)_1px,transparent_1px),linear-gradient(90deg,rgba(255,255,255,0.015)_1px,transparent_1px)] bg-[size:60px_60px]"></div>

                    Full-Stack Software Developer

            <!-- Photo -->

                <div class="absolute inset-0 bg-gradient-to-br from-violet-600/30 to-fuchsia-600/30 rounded-3xl blur-2xl scale-110"></div>
