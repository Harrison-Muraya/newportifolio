{% load static %}
<button type="button" id="hm-fab" class="hm-fab" aria-expanded="false" aria-controls="hm-dock">
  <span class="hm-fab-label" data-i18n="hero_ask">Ask Harrison</span>
  <span class="hm-fab-avatar">
    <img src="{% static 'harrison/images/noBgsmall.png' %}" alt="">
  </span>
</button>

<aside id="hm-dock" class="hm-dock" aria-hidden="true" role="dialog" aria-labelledby="hm-dock-heading">
  <div class="hm-dock-head">
    <div class="hm-dock-title" id="hm-dock-heading">
      <img src="{% static 'harrison/images/noBgsmall.png' %}" alt="">
      <span data-i18n="hero_ask">Ask Harrison</span>
      <span class="hm-dock-live" aria-hidden="true">AI</span>
    </div>
    <button type="button" id="hm-dock-close" class="hm-dock-close" aria-label="Close chat">×</button>
  </div>
  <div id="hm-dock-log" class="hm-dock-body">
    <div class="hm-msg hm-msg-bot" data-i18n="chat_greet">Ask about projects, stack, or how to get in touch — I’m Harrison’s AI assistant.</div>
  </div>
  <div id="hm-chips" class="hm-chips">
    <button type="button" class="hm-chip" data-hm-chip="Walk me through your strongest project">Strongest project</button>
    <button type="button" class="hm-chip" data-hm-chip="What stack do you ship with?">What stack?</button>
    <button type="button" class="hm-chip" data-hm-chip="How do I contact you?">Contact</button>
  </div>
  <div id="hm-announcer" class="visually-hidden" aria-live="polite"></div>
  <div id="hm-dock-status" class="hm-status" role="status"></div>
  <form id="hm-dock-form" class="hm-dock-form">
    {% csrf_token %}
    <label class="visually-hidden" for="hm-dock-input">Message</label>
    <textarea id="hm-dock-input" rows="1" maxlength="4000" required placeholder="Type a message..." data-i18n-placeholder="chat_placeholder"></textarea>
    <button type="submit" data-i18n="chat_send">Send</button>
  </form>
</aside>
