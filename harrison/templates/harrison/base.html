<!DOCTYPE html>
<html lang="en">
<head>
  {% load static %}
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Harrison Muraya — Software Developer</title>
  <meta name="description" content="Full-Stack Software Developer based in Nairobi, Kenya. Specialising in Laravel, Django, React, and payment integrations.">

  <!-- Fonts: Fraunces (display/serif) + Outfit (body) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,700;0,9..144,900;1,9..144,400;1,9..144,900&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="{% static 'harrison/css/style.css' %}">
</head>
<body>
  {% block content %}{% endblock %}

  <script>
    const CSRF_TOKEN = "{{ csrf_token }}";
    const IS_AUTHENTICATED = {{ request.user.is_authenticated|yesno:"true,false" }};
    const IS_SUPERUSER = {{ request.user.is_superuser|yesno:"true,false" }};
    const USERNAME = "{{ request.user.username|default:'' }}";
  </script>
  <script src="{% static 'harrison/js/base.js' %}"></script>
</body>
</html>
