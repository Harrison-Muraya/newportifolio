<!DOCTYPE html>
<html lang="en">
<head>
    {% load static %}
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register — Harrison Muraya</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="{% static 'harrison/css/style.css' %}">
</head>
<body style="background:#FDFCF8;color:#1A1408;" class="min-h-screen flex items-center justify-center p-6 overflow-hidden">
    <!-- Background blobs -->
    <div class="fixed inset-0 overflow-hidden pointer-events-none">
        <div class="absolute top-1/3 right-1/4 w-96 h-96 rounded-full blur-[120px]" style="background:rgba(245,200,0,0.18);"></div>
        <div class="absolute bottom-1/3 left-1/4 w-80 h-80 rounded-full blur-[100px]" style="background:rgba(255,62,138,0.12);"></div>
        <div class="absolute inset-0" style="background-image:radial-gradient(circle, rgba(26,20,8,0.05) 1px, transparent 1px);background-size:32px 32px;"></div>
    </div>

    <div class="relative w-full max-w-lg">
        <!-- Logo -->
        <div class="text-center mb-8">
            <a href="/" class="font-syne text-3xl font-bold">
                <span style="color:#1A1408;">H</span><span style="color:#FF3E8A;">M</span>
            </a>
            <p class="mt-2 text-sm" style="color:#8A7A60;">Create your account</p>
        </div>

        <div class="rounded-3xl p-8 shadow-xl border-2" style="background:white;border-color:rgba(26,20,8,0.08);">
            {% if messages %}
            {% for message in messages %}
            <div class="mb-5 p-4 rounded-xl text-sm font-medium" style="background:#FFD6E8;border:1.5px solid #FF3E8A;color:#C4005D;">
                {{ message }}
            </div>
            {% endfor %}
            {% endif %}

            <form method="POST" class="space-y-4">
                {% csrf_token %}
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="text-xs tracking-wide uppercase block mb-2 font-semibold" style="color:#8A7A60;">First Name</label>
                        <input name="first_name" type="text" placeholder="John"
                            class="w-full rounded-xl px-4 py-3 text-sm transition focus:outline-none"
                            style="background:#F5F3EC;border:1.5px solid rgba(26,20,8,0.12);color:#1A1408;"
                            onfocus="this.style.borderColor='#FF3E8A'" onblur="this.style.borderColor='rgba(26,20,8,0.12)'">
                    </div>
                    <div>
                        <label class="text-xs tracking-wide uppercase block mb-2 font-semibold" style="color:#8A7A60;">Last Name</label>
                        <input name="last_name" type="text" placeholder="Doe"
                            class="w-full rounded-xl px-4 py-3 text-sm transition focus:outline-none"
                            style="background:#F5F3EC;border:1.5px solid rgba(26,20,8,0.12);color:#1A1408;"
                            onfocus="this.style.borderColor='#FF3E8A'" onblur="this.style.borderColor='rgba(26,20,8,0.12)'">
                    </div>
                </div>
                <div>
                    <label class="text-xs tracking-wide uppercase block mb-2 font-semibold" style="color:#8A7A60;">Username <span style="color:#FF3E8A;">*</span></label>
                    <input name="username" type="text" required autofocus placeholder="cooluser123"
                        class="w-full rounded-xl px-4 py-3 text-sm transition focus:outline-none"
                        style="background:#F5F3EC;border:1.5px solid rgba(26,20,8,0.12);color:#1A1408;"
                        onfocus="this.style.borderColor='#FF3E8A'" onblur="this.style.borderColor='rgba(26,20,8,0.12)'">
                </div>
                <div>
                    <label class="text-xs tracking-wide uppercase block mb-2 font-semibold" style="color:#8A7A60;">Email <span style="color:#B0A890;">(optional)</span></label>
                    <input name="email" type="email" placeholder="you@example.com"
                        class="w-full rounded-xl px-4 py-3 text-sm transition focus:outline-none"
                        style="background:#F5F3EC;border:1.5px solid rgba(26,20,8,0.12);color:#1A1408;"
                        onfocus="this.style.borderColor='#F5C800'" onblur="this.style.borderColor='rgba(26,20,8,0.12)'">
                </div>
                <div>
                    <label class="text-xs tracking-wide uppercase block mb-2 font-semibold" style="color:#8A7A60;">Password <span style="color:#FF3E8A;">*</span></label>
                    <input name="password1" type="password" required placeholder="Min. 8 characters"
                        class="w-full rounded-xl px-4 py-3 text-sm transition focus:outline-none"
                        style="background:#F5F3EC;border:1.5px solid rgba(26,20,8,0.12);color:#1A1408;"
                        onfocus="this.style.borderColor='#FF3E8A'" onblur="this.style.borderColor='rgba(26,20,8,0.12)'">
                </div>
                <div>
                    <label class="text-xs tracking-wide uppercase block mb-2 font-semibold" style="color:#8A7A60;">Confirm Password <span style="color:#FF3E8A;">*</span></label>
                    <input name="password2" type="password" required placeholder="Repeat your password"
                        class="w-full rounded-xl px-4 py-3 text-sm transition focus:outline-none"
                        style="background:#F5F3EC;border:1.5px solid rgba(26,20,8,0.12);color:#1A1408;"
                        onfocus="this.style.borderColor='#FF3E8A'" onblur="this.style.borderColor='rgba(26,20,8,0.12)'">
                </div>
                <button type="submit" class="w-full py-4 rounded-xl font-bold text-white hover:opacity-90 transition shadow-lg mt-2" style="background:linear-gradient(135deg,#FF3E8A,#F5C800);color:#1A1408;box-shadow:0 8px 24px rgba(255,62,138,0.25);">
                    <span style="color:white;">Create Account</span>
                </button>
            </form>

            <div class="mt-6 pt-6 border-t text-center" style="border-color:rgba(26,20,8,0.08);">
                <p class="text-sm" style="color:#8A7A60;">
                    Already have an account? 
                    <a href="/login/" class="font-semibold hover:opacity-80 transition" style="color:#FF3E8A;">Sign in</a>
                </p>
                <a href="/" class="block mt-3 text-sm hover:opacity-70 transition" style="color:#B0A890;">← Back to Portfolio</a>
            </div>
        </div>
    </div>
</body>
</html>
