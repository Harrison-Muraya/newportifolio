<!DOCTYPE html>
<html lang="en">
<head>
  {% load static %}
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register — Harrison Muraya</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,700;0,9..144,900;1,9..144,900&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'harrison/css/style.css' %}">
</head>
<body>
  <div class="auth-page">
    <div class="auth-bg"></div>

    <div class="auth-card" style="max-width:34rem;">
      <div class="auth-logo">
        <a href="/">H<span>M</span></a>
        <p>Create your account</p>
      </div>

      {% if messages %}
      {% for message in messages %}
      <div class="auth-error">{{ message }}</div>
      {% endfor %}
      {% endif %}

      <form method="POST" class="auth-form">
        {% csrf_token %}

        <div class="form-row form-group">
          <div>
            <label class="form-label">First Name</label>
            <input name="first_name" type="text" placeholder="John" class="form-input">
          </div>
          <div>
            <label class="form-label">Last Name</label>
            <input name="last_name" type="text" placeholder="Doe" class="form-input">
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">Username <span style="color:var(--accent);">*</span></label>
          <input name="username" type="text" required autofocus placeholder="cooluser123" class="form-input">
        </div>

        <div class="form-group">
          <label class="form-label">Email <span style="color:var(--ink-faint);font-weight:400;">(optional)</span></label>
          <input name="email" type="email" placeholder="you@example.com" class="form-input">
        </div>

        <div class="form-group">
          <label class="form-label">Password <span style="color:var(--accent);">*</span></label>
          <input name="password1" type="password" required placeholder="Minimum 8 characters" class="form-input">
        </div>

        <div class="form-group">
          <label class="form-label">Confirm Password <span style="color:var(--accent);">*</span></label>
          <input name="password2" type="password" required placeholder="Repeat your password" class="form-input">
        </div>

        <button type="submit" class="btn-submit">Create Account</button>
      </form>

      <div class="auth-footer">
        <p>Already have an account? <a href="/login/">Sign in</a></p>
        <a href="/" class="back-link">← Back to Portfolio</a>
      </div>
    </div>
  </div>
</body>
</html>
