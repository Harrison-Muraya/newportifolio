<!DOCTYPE html>
<html lang="en">
<head>
  {% load static %}
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In — Harrison Muraya</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,700;0,9..144,900;1,9..144,900&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'harrison/css/style.css' %}">
</head>
<body>
  <div class="auth-page">
    <div class="auth-bg"></div>

    <div class="auth-card">
      <div class="auth-logo">
        <a href="/">H<span>M</span></a>
        <p>Sign in to your account</p>
      </div>

      {% if messages %}
      {% for message in messages %}
      <div class="auth-error">{{ message }}</div>
      {% endfor %}
      {% endif %}

      <form method="POST" class="auth-form">
        {% csrf_token %}

        <div class="form-group">
          <label class="form-label" for="username">Username</label>
          <input name="username" id="username" type="text" required autofocus
            placeholder="Enter your username" class="form-input">
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <input name="password" id="password" type="password" required
            placeholder="Enter your password" class="form-input">
        </div>

        <button type="submit" class="btn-submit" style="margin-top:0.25rem;">Sign In</button>
      </form>

      <div class="auth-footer">
        <p>Don't have an account? <a href="/register/">Register free</a></p>
        <a href="/" class="back-link">← Back to Portfolio</a>
      </div>
    </div>
  </div>
</body>
</html>
