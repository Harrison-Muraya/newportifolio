<!DOCTYPE html>
<html lang="en">
<head>
    {% load static %}
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In — Harrison Muraya</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="{% static 'harrison/css/style.css' %}">
</head>
<body class="bg-[#080810] text-white min-h-screen flex items-center justify-center p-6 overflow-hidden">
    <!-- Background -->
    <div class="fixed inset-0 overflow-hidden pointer-events-none">
        <div class="absolute top-1/3 left-1/3 w-96 h-96 bg-violet-600/20 rounded-full blur-[120px]"></div>
        <div class="absolute bottom-1/3 right-1/3 w-80 h-80 bg-fuchsia-600/15 rounded-full blur-[100px]"></div>
        <div class="absolute inset-0 bg-[linear-gradient(rgba(255,255,255,0.015)_1px,transparent_1px),linear-gradient(90deg,rgba(255,255,255,0.015)_1px,transparent_1px)] bg-[size:60px_60px]"></div>
    </div>

    <div class="relative w-full max-w-md">
        <!-- Logo -->
        <div class="text-center mb-10">
            <a href="/" class="font-syne text-3xl font-bold">
                <span class="text-white">H</span><span class="text-violet-400">M</span>
            </a>
            <p class="text-white/40 mt-2 text-sm">Sign in to your account</p>
        </div>

        <div class="bg-white/[0.03] border border-white/[0.08] rounded-3xl p-8 backdrop-blur-sm shadow-2xl">
            {% if messages %}
            {% for message in messages %}
            <div class="mb-5 p-4 bg-rose-500/10 border border-rose-500/20 rounded-xl text-rose-300 text-sm">
                {{ message }}
            </div>
            {% endfor %}
            {% endif %}

            <form method="POST" class="space-y-5">
                {% csrf_token %}
                <div>
                    <label class="text-white/40 text-xs tracking-wide uppercase block mb-2">Username</label>
                    <input name="username" type="text" required autofocus
                        class="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-3.5 text-white placeholder-white/20 focus:outline-none focus:border-violet-500 focus:bg-white/[0.07] transition text-sm"
                        placeholder="Enter your username">
                </div>
                <div>
                    <label class="text-white/40 text-xs tracking-wide uppercase block mb-2">Password</label>
                    <input name="password" type="password" required
                        class="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-3.5 text-white placeholder-white/20 focus:outline-none focus:border-violet-500 focus:bg-white/[0.07] transition text-sm"
                        placeholder="Enter your password">
                </div>
                <button type="submit" class="w-full py-4 bg-gradient-to-r from-violet-600 to-fuchsia-600 text-white rounded-xl font-semibold hover:opacity-90 transition shadow-lg shadow-violet-500/25 mt-2">
                    Sign In
                </button>
            </form>

            <div class="mt-6 pt-6 border-t border-white/[0.06] text-center">
                <a href="/" class="text-white/30 hover:text-white/60 text-sm transition">← Back to Portfolio</a>
            </div>
        </div>
    </div>
</body>
</html>
